services:
  app:
    build:
      context: .
      target: prod
    env_file: .env
    expose:
      - "8000"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deploy-or-not.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.deploy-or-not.entrypoints=websecure"
      - "traefik.http.routers.deploy-or-not.tls.certresolver=letsencrypt"
      - "traefik.http.services.deploy-or-not.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.deploy-or-not-ratelimit.ratelimit.average=${RATE_LIMIT_AVERAGE:-10}"
      - "traefik.http.middlewares.deploy-or-not-ratelimit.ratelimit.burst=${RATE_LIMIT_BURST:-20}"
      - "traefik.http.routers.deploy-or-not.middlewares=deploy-or-not-ratelimit"
