fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [ "--fix", "lf" ]
        types: [ python, yaml, toml, text ]
      - id: detect-private-key
      - id: check-yaml
        exclude: ^docker-compose\.traefik\.shared\.yml$
      - id: check-yaml
        name: check Compose YAML syntax
        files: ^docker-compose\.traefik\.shared\.yml$
        args: [--unsafe]
      - id: check-toml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [ "--fix", "--show-fixes" ]
        files: ^(api|tests|config)/
      - id: ruff-format
        files: ^(api|tests|config)/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
